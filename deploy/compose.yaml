# Three containers and one folder on the host.
#
#   docs-db    the database — the published image, pulled, never built here
#   docs-api   the site's API
#   docs-web   the front end
#
# The database is separate from the API because when they shared a container a
# script supervised both, and either one exiting took the other down — so an API
# crash stopped the database.
#
# It used to be built here too, from a `Dockerfile.db` that fetched the engine's
# private repository over a forwarded SSH agent and compiled a vendored RocksDB,
# which took forty minutes and needed a key. That is gone: the engine is
# published as `tessaridb/tessaridb` and this file pulls it. A deploy no longer
# needs access to the engine's source at all.
#
# The store's directory is bound to a folder on the host, so the content
# survives the container — and so that a backup is a copy of a directory rather
# than an operation somebody has to remember how to perform.
#
#   cp deploy/.env.example deploy/.env    # then set the three passwords
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d
#
# On a **fresh** store, once, before the first `up` has anything to serve:
#
#   docker compose -f deploy/compose.yaml --env-file deploy/.env \
#     --profile init run --rm init
#
# The site is then on http://localhost:3000.

name: tessaridb-docs

# Docker's json-file driver keeps everything a container has ever said unless it
# is told otherwise, and every service below restarts itself forever. On an
# unattended host that is a disk that fills quietly over months and takes the
# site down for a reason that has nothing to do with the site. Fifty megabytes
# per service is more log than anyone reads and far less than anyone misses.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # Pinned to a version, deliberately not `latest`.
    #
    # The on-disk format is not promised across alpha versions, and `latest`
    # moves. A container that quietly picked up a newer engine on an unattended
    # restart is how a store stops opening at three in the morning, for a reason
    # nobody changed anything to cause. Moving this line is how the engine
    # under this store is upgraded, and it should be a decision with a backup
    # taken before it.
    #
    # Verified against this store on 2026-09-02 before the switch: the 0.0.2-alpha
    # engine opened the 0.0.1-alpha store, and all 44 page bodies came back
    # byte-for-byte identical through the unchanged API.
    #
    # Moved to 0.0.3-alpha on 2026-09-05, by owner decision and after a backup.
    # It had lagged on 0.0.2-alpha for three days, deliberately, because this
    # release changed the search index format — and the site's search is written
    # against operators (`MATCHES PREFIX`, `MATCHES FUZZY`) that 0.0.2-alpha
    # refuses. So the pin and the API are one change: an `api` built from this
    # tree against a 0.0.2-alpha store answers a search with an error, not with
    # fewer results.
    #
    # The migration was a namespace move rather than an upgrade in place, which
    # is what the paragraph below is about. Rolling back means pointing
    # DOCS_NAMESPACE at `v0_0_2_alpha`, its two service users, and this line at
    # `0.0.2-alpha` — all three together, and with an `api` from before this
    # commit.
    image: tessaridb/tessaridb:0.0.3-alpha
    environment:
      TESSARIDB_STORE: /var/lib/tessaridb/store
      # Every interface, because the API is in a different container. That is
      # the one thing this split widens: the wire protocol carries no TLS, so
      # the network it is on is declared `internal` below.
      TESSARIDB_ADDRESS: 0.0.0.0:7654
      # HTTP on the internal network and nowhere else. It exists so the image's
      # own health check can ask the node `/health` — which the node answers
      # from the store — rather than ask the kernel whether a port is open. No
      # `ports` entry below publishes it.
      TESSARIDB_HTTP_ADDRESS: 0.0.0.0:8000
      # Declares the first user on a **fresh** store and closes it, once. On a
      # store that already has users the node says so and changes nothing, so
      # this can sit here on every restart forever. It is not a password reset.
      #
      # The user it declares is store-wide, which is what the `init` service
      # below then needs in order to declare a namespace.
      TESSARIDB_INITIAL_USER: ${DOCS_OWNER_USER:-owner}
      TESSARIDB_INITIAL_PASSWORD: ${DOCS_OWNER_PASSWORD:?set it in deploy/.env}
      TESSARIDB_LOG: ${RUST_LOG:-info}
    volumes:
      # The host folder. Everything the site is lives here. Its ownership must
      # be the image's uid 10001: a bind mount presents the host's ownership and
      # shadows the image's own, and the symptom of getting it wrong is a
      # database that cannot open its store.
      - ${DOCS_STORE_PATH:-./store}:/var/lib/tessaridb
    # No `ports`. Nothing outside the store network reaches the database.
    expose:
      - "7654"
    networks:
      - store
    restart: unless-stopped
    logging: *logging

  # ── the fresh-store bootstrap, which is not part of `up` ───────────────────
  #
  # The same image, run as a client rather than as a node — one binary, so the
  # thing that serves the store is the thing that talks to it. It declares the
  # namespace, the database and the two service accounts, and says nothing the
  # second time.
  #
  # Behind a profile on purpose, so a routine `up` never runs it. It has to
  # succeed exactly once, on a store that has just been created, and a service
  # that must not fail is a poor thing to put in the restart path of a site that
  # is already serving. Run it by hand:
  #
  #   docker compose -f deploy/compose.yaml --env-file deploy/.env \
  #     --profile init run --rm init
  #
  # **Moving `DOCS_NAMESPACE` means renaming the two service users as well.**
  # Their names are unique across the store and both statements below carry
  # `IF NOT EXISTS`, so re-running this against a new namespace answers `ok` and
  # leaves them scoped to the old one — after which the API is refused with
  # *"… is outside this user's namespace and database"*. Name them after the
  # namespace (`reader_v0_0_3`) and the previous namespace also stays servable,
  # which is what makes pointing `DOCS_NAMESPACE` back an actual rollback.
  #
  # It needs the owner declared by the `db` service above, and that owner has to
  # be **store-wide** — `DEFINE NAMESPACE` has no tenancy to check because its
  # subject is the store itself, so an owner scoped to one database is refused.
  # `TESSARIDB_INITIAL_USER` declares a store-wide one; a store bootstrapped by
  # the older `start-db.sh` may not have, and this will say so rather than
  # pretend.
  init:
    profiles: ["init"]
    image: tessaridb/tessaridb:0.0.3-alpha
    environment:
      TESSARIDB_PASSWORD: ${DOCS_OWNER_PASSWORD:?set it in deploy/.env}
    command:
      - --at
      - db:7654
      - --user
      - ${DOCS_OWNER_USER:-owner}
      - -e
      - |
        DEFINE NAMESPACE IF NOT EXISTS ${DOCS_NAMESPACE:-v0_0_3_alpha};
        USE NAMESPACE ${DOCS_NAMESPACE:-v0_0_3_alpha};
        DEFINE DATABASE IF NOT EXISTS docs;
        USE DATABASE docs;
        DEFINE USER IF NOT EXISTS ${DOCS_READER_USER:-reader} ON ${DOCS_NAMESPACE:-v0_0_3_alpha}.docs ROLE viewer PASSWORD '${DOCS_READER_PASSWORD:?set it in deploy/.env}';
        DEFINE USER IF NOT EXISTS ${DOCS_EDITOR_USER:-editor} ON ${DOCS_NAMESPACE:-v0_0_3_alpha}.docs ROLE editor PASSWORD '${DOCS_EDITOR_PASSWORD:?set it in deploy/.env}';
    depends_on:
      db:
        condition: service_healthy
    networks:
      - store
    restart: "no"
    logging: *logging

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      # No `ssh:` any more. The one git dependency is `tessaridb-client`, whose
      # repository is public (checked 2026-09-02: an anonymous fetch answers
      # 200), so the build clones it over HTTPS and needs no key. It used to
      # forward an agent because that repository was private and because the
      # build rewrote every GitHub URL to SSH; both are gone.
    ports:
      # Loopback only, and for the same reason the front end binds loopback: the
      # public edge is the TLS terminator on the host, and this is what it
      # proxies to. Binding every interface would publish a plaintext copy of
      # the API beside the TLS one, on a port anybody can reach, and every rule
      # the edge applies — the rate limit on sign-in, the body cap — would be
      # bypassable by asking the other door.
      #
      # Docker writes its own firewall rules ahead of ufw's, so this prefix is a
      # control and not a preference.
      - "${DOCS_API_BIND:-127.0.0.1:8080}:8080"
    environment:
      # The service name, not loopback: the database is a different container.
      TESSARIDB_ADDRESS: db:7654
      DOCS_BIND: 0.0.0.0:8080
      DOCS_NAMESPACE: ${DOCS_NAMESPACE:-v0_0_3_alpha}
      # Two identities, and the difference is the point. Writes run as the
      # editor; public reads run as the reader, which is a `viewer`, so a write
      # attempted on the read path is refused by the store rather than by this
      # server's routing.
      DOCS_USER: ${DOCS_EDITOR_USER:-editor}
      DOCS_PASSWORD: ${DOCS_EDITOR_PASSWORD:?set it in deploy/.env}
      DOCS_READER_USER: ${DOCS_READER_USER:-reader}
      DOCS_READER_PASSWORD: ${DOCS_READER_PASSWORD:?set it in deploy/.env}
      # The first person who may edit. Seeded into the API's own `account` table
      # on every start, so changing it here changes it in the store. This is not
      # a database user: it buys a day-long token, and the token is what the
      # write routes accept. Left unset, nothing is seeded and only accounts
      # already in the store can sign in.
      DOCS_ADMIN_USER: ${DOCS_ADMIN_USER:-}
      DOCS_ADMIN_PASSWORD: ${DOCS_ADMIN_PASSWORD:-}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      db:
        # Waits for the store to be listening *and* to have declared its
        # accounts. Without the second half the API could connect to an open
        # store and be refused a moment later, when the owner's declaration
        # closes it.
        condition: service_healthy
    # No `ports`. The API is reachable only from the front end's container and
    # from the store network. Publishing 8080 would put it on the host's network,
    # where a token — and, at /api/session, a password — would travel in the
    # clear; do it only deliberately, and only behind something that terminates
    # TLS.
    expose:
      - "8080"
    networks:
      - store
      - edge
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      DOCS_API: http://api:8080
    ports:
      # Loopback by default. The public edge is a TLS terminator on the host,
      # which is what holds the certificate and what 80 and 443 reach; binding
      # this to every interface would publish an HTTP origin beside it that
      # answers on the same name without one, and nothing would report that.
      # Docker writes its own firewall rules ahead of ufw's, so this prefix is a
      # control and not a preference — widen it and ufw will keep saying deny.
      - "${DOCS_WEB_BIND:-127.0.0.1:3000}:3000"
    depends_on:
      api:
        # The API's health route answers only once it can reach the store, so
        # this waits for the whole chain. Without it the front end's first
        # requests land while the store is still opening and the reader sees an
        # empty tree that a refresh fixes — the kind of fault nobody reports.
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped
    logging: *logging

networks:
  # The database's network. `internal` because nothing on it has any reason to
  # reach the internet, and because an unencrypted database protocol should be
  # on as small a network as it can be.
  store:
    internal: true
  # Where the front end's published port lives. Not internal: publishing a port
  # onto an internal network does not work.
  edge: {}
