# The public edge for the documentation site. The front end itself listens on
# loopback only, so this is the single thing that answers on the name — which
# is what keeps a certificate-less HTTP origin from existing beside it.
server {
    server_name docs.tessaridb.com;

    server_tokens off;

    # The site is only ever reachable over TLS — :80 below redirects and never
    # serves — so a browser that has been here once has no reason to try the
    # plaintext port again. No `includeSubDomains`: this certificate covers one
    # name and must not speak for the ones beside it.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The API, so the corpus can be published from a laptop rather than from a
    # shell on this machine. Before this, editing a page required `root` here —
    # so everyone who could edit documentation held the machine running the
    # database, and any runbook describing the procedure was a document about
    # infrastructure.
    #
    # What changes: the read routes were already public in substance, since the
    # site renders their content. The **write** routes go from unreachable to
    # reachable-but-authenticated — token-gated by the API, a token needs a
    # password, and a password is Argon2 behind a per-name throttle. That is the
    # posture of any authenticated API and it is a real increase over "no route
    # exists", taken because the alternative is worse.
    location = /api/session {
        # The half the API's own throttle cannot see. It counts failures per
        # *name*; this counts requests per *source*, so a caller working through
        # a list of names is bounded too. Sign-in is also the one route that
        # computes an Argon2 hash, which is what makes it worth a rate of its
        # own rather than the shared one below.
        limit_req zone=docs_session burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        # A page is prose. Two mebibytes is far more than any page here and far
        # less than a body worth absorbing from somebody who is not publishing.
        client_max_body_size 2m;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/docs.tessaridb.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/docs.tessaridb.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = docs.tessaridb.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name docs.tessaridb.com;
    return 404; # managed by Certbot


}
