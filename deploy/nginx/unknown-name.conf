# A name that somebody points at this address and that we do not serve gets no
# answer at all.
#
# Without an explicit `default_server` on 443, nginx falls back to whichever TLS
# block it happened to read first. That is how an unrelated hostname ends up
# being handed the documentation's certificate — a mismatch warning — and then
# the documentation itself. Rejecting the handshake says what is true: nothing
# here answers to that name.
#
# This block carries no certificate, and needs none: `ssl_reject_handshake`
# exists precisely so a default server can refuse before one would be sent.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_tokens off;
    ssl_reject_handshake on;
}
