# The apex. There is no site here yet, and until there is, the only useful
# thing it can say is where the documentation lives.
#
# It needs a certificate of its own regardless of having nothing to serve:
# browsers try HTTPS first now, so a name pointed at this address with no
# certificate for it hands the visitor a security warning as their first
# impression of the project.
#
# The redirect is a 302 on purpose. A 301 is cached by browsers for as long as
# they please, and would outlive the day the real site lands here.
server {
    listen 80;
    listen [::]:80;
    server_name tessaridb.com;

    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tessaridb.com;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/tessaridb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tessaridb.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # To the root, not to $request_uri: the apex has no paths of its own, so
    # carrying one across would only turn a wrong guess into a 404 elsewhere.
    return 302 https://docs.tessaridb.com/;
}
