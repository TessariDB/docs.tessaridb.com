# Belongs in /etc/nginx/conf.d/ on the host, not in a server block.
#
# `limit_req_zone` is only valid at `http` level, which is why this is a file of
# its own rather than a few lines inside docs.tessaridb.com.conf — and why that
# file's `limit_req zone=docs_session` will fail `nginx -t` if this one is not
# installed beside it.
#
# Ten sign-ins a minute per address, with a burst of five. The API throttles per
# *name* already; this bounds per *source*, which is the half a per-name counter
# cannot see, and it is aimed at the one route that computes an Argon2 hash.
limit_req_zone $binary_remote_addr zone=docs_session:10m rate=10r/m;
